# Push a tag like v0.8.2 and this builds Padvinder-v0.8.2.zip (with a Padvinder/ folder inside,
# ready to unzip into Interface\AddOns), publishes it as a GitHub release and uploads the same
# zip to CurseForge. Run it by hand (Actions -> Release -> Run workflow) to only check that the
# CurseForge token and game version work, without uploading anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curseforge-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CurseForge token and game version
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: bash .github/scripts/curseforge.sh check

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version in the .toc matches the tag
        run: |
          toc=$(grep -oP '^## Version:\s*\K\S+' Padvinder.toc)
          if [ "v$toc" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Padvinder.toc says $toc but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build zip
        run: git archive --format=zip --prefix=Padvinder/ -o "Padvinder-$GITHUB_REF_NAME.zip" HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/VERSION/$GITHUB_REF_NAME/g" .github/release-notes.md > notes.md
          git fetch -q --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" >> notes.md
          gh release create "$GITHUB_REF_NAME" "Padvinder-$GITHUB_REF_NAME.zip" \
            --title "Padvinder $GITHUB_REF_NAME" --notes-file notes.md
